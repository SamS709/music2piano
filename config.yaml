project: pop2piano
dataset:
  target_length: 256
  n_bars: 4
  sample_rate: 22050
  mel_is_conditioned: true
composer_to_feature_token:
  composer1: 2052
  composer2: 2053
  composer3: 2054
  composer4: 2055
  composer5: 2056
  composer6: 2057
  composer7: 2058
  composer8: 2059
  composer9: 2060
  composer10: 2061
  composer11: 2062
  composer12: 2063
  composer13: 2064
  composer14: 2065
  composer15: 2066
  composer16: 2067
  composer17: 2068
  composer18: 2069
  composer19: 2070
  composer20: 2071
  composer21: 2072
t5:
  feed_forward_proj: gated-gelu
  tie_word_embeddings: false
  tie_encoder_decoder: false
  vocab_size: 288
  relative_attention_num_buckets: 32
tokenizer:
  vocab_size:
    special: 4
    note: 128
    time: 100
    duration: 32
    velocity_bins: 0
training:
  resume: false
  num_gpu: 1
  max_epochs: 10000
  accumulate_grad_batches: 2
  check_val_every_n_epoch: 10
  find_lr: false
  optimizer: adafactor
  lr: 0.0001
  lr_min: 1.0e-06
  batch_size: 16
  gradient_clip_val: 3.0
  warmup_steps: 500
  weight_decay: 0.01
  scheduler: cosine # or none
  log_every_n_steps: 10
encoder:
  name: m-a-p/MERT-v1-95M
  revision: null
  sample_rate: 24000
  freeze: true
  normalize_waveform: true
  context_seconds: 2.0
  lr_mult: 0.1 # only if weights unfreezed
