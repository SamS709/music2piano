project: pop2piano
dataset:
  target_length: 256
  n_bars: 8
  sample_rate: 22050
  mel_is_conditioned: true
composer_to_feature_token:
  composer1: 2052
  composer2: 2053
  composer3: 2054
  composer4: 2055
  composer5: 2056
  composer6: 2057
  composer7: 2058
  composer8: 2059
  composer9: 2060
  composer10: 2061
  composer11: 2062
  composer12: 2063
  composer13: 2064
  composer14: 2065
  composer15: 2066
  composer16: 2067
  composer17: 2068
  composer18: 2069
  composer19: 2070
  composer20: 2071
  composer21: 2072
t5:
  feed_forward_proj: gated-gelu
  dropout_rate: 0.2
  tie_word_embeddings: false
  tie_encoder_decoder: false
  vocab_size: 288
  relative_attention_num_buckets: 32
tokenizer:
  vocab_size:
    special: 4
    note: 128
    time: 100
    duration: 32
    velocity_bins: 0
augmentation:
  pitch_shift:
    probability: 0.5
    min_semitones: -3
    max_semitones: 3
training:
  resume: false
  finetune_lr: 2e-5
  freeze_encoder: true
  finetune_encoder_top_layers: 2
  seed: 3407
  composer: composer1
  output_dir: checkpoints
  num_workers: 4
  validation_fraction: 0.1
  train_stride_fraction: 0.5
  precision: bf16-mixed
  num_gpu: 1
  max_epochs: 30
  early_stopping_patience: 7
  early_stopping_min_delta: 0.0005
  accumulate_grad_batches: 4
  check_val_every_n_epoch: 1
  find_lr: false
  optimizer: adamw
  lr: 1e-4
  lr_min: 1.0e-06
  batch_size: 8
  gradient_clip_val: 1.0
  warmup_steps: 1000
  weight_decay: 0.01
  scheduler: cosine # or none
  log_every_n_steps: 100
encoder:
  name: m-a-p/MERT-v1-95M
  revision: null
  sample_rate: 24000
  freeze: true
  normalize_waveform: true
  context_seconds: 2.0
  lr_mult: 0.5 # only if weights unfreezed
  feature_time_mask_probability: 0.5
  feature_time_mask_max_ratio: 0.04
  feature_dropout_probability: 0.05
  feature_noise_std: 0.01
